<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot password – JMI</title><link rel="stylesheet" href="styles.css"></head><body data-public="1">
<div class="auth"><div class="card">
 <div class="center big">🔑</div><h1>Forgot password</h1><p class="tag">We will email you an OTP</p>
 <div id="s1">
  <label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com">
  <button class="btn" id="go">Send OTP</button>
 </div>
 <div id="s2" hidden>
  <input id="otp" inputmode="numeric" maxlength="6" placeholder="6 digit OTP">
  <input id="pw" type="password" autocomplete="new-password" placeholder="New password (min 8 characters)">
  <button class="btn" id="reset">Reset password</button>
  <button class="lnk" id="resend" style="background:none;width:100%">Resend OTP</button>
 </div>
 <div class="msg" id="m"></div>
 <a class="lnk" href="login.html">Back to login</a>
</div></div>
<script src="common.js"></script>
<script>
async function send() {
  const email = $("email").value.trim();
  if (!email) return say("m", "Enter your email.");
  $("go").disabled = true; say("m", "Sending OTP…", true);
  try { await api("/forgot", { email }); $("s1").hidden = true; $("s2").hidden = false; say("m", "If this email has an account, an OTP was sent.", true); }
  catch (e) { say("m", e.message); }
  $("go").disabled = false;
}
$("go").onclick = send; $("resend").onclick = send;
$("reset").onclick = async () => {
  const otp = $("otp").value.trim(), password = $("pw").value;
  if (!/^\d{6}$/.test(otp)) return say("m", "Enter the 6 digit OTP.");
  if (password.length < 8) return say("m", "Password must be at least 8 characters.");
  $("reset").disabled = true;
  try { await api("/reset", { email: $("email").value.trim(), otp, password }); say("m", "Password changed. Redirecting to login…", true); setTimeout(() => location.replace("login.html"), 1200); }
  catch (e) { say("m", e.message); $("reset").disabled = false; }
};
</script></body></html>
