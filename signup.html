<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign up – JMI</title><link rel="stylesheet" href="styles.css"></head><body data-public="1">
<div class="auth"><div class="card">
 <div class="center big">🎓</div><h1>Create account</h1><p class="tag">Join the Jamia community site</p>
 <div id="s1">
  <label for="name">Full name</label><input id="name" autocomplete="name" placeholder="Your name">
  <label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com">
  <label for="pw">Password (min 8 characters)</label>
  <div class="pw"><input id="pw" type="password" autocomplete="new-password" placeholder="Create a password"><button type="button" id="eye" aria-label="Show password">👁️</button></div>
  <div class="bar"><i id="str"></i></div>
  <label for="pw2">Confirm password</label><input id="pw2" type="password" autocomplete="new-password" placeholder="Repeat password">
  <button class="btn" id="go">Send OTP</button>
 </div>
 <div id="s2" hidden>
  <p class="center" style="margin-bottom:12px">We sent a 6-digit OTP to your email. Check Spam too.</p>
  <input id="otp" inputmode="numeric" maxlength="6" placeholder="6 digit OTP">
  <button class="btn" id="verify">Verify &amp; create account</button>
  <button class="lnk" id="resend" style="background:none;width:100%">Resend OTP</button>
 </div>
 <div class="msg" id="m"></div>
 <a class="lnk" href="login.html">Already have an account? Login</a>
</div></div>
<script src="common.js"></script>
<script>
$("eye").onclick = () => $("pw").type = $("pw").type === "password" ? "text" : "password";
$("pw").oninput = () => { const v = $("pw").value; let s = 0; if (v.length >= 8) s++; if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++; if (/\d/.test(v)) s++; if (/[^A-Za-z0-9]/.test(v)) s++;
  $("str").style.width = s * 25 + "%"; $("str").style.background = ["#ef4444", "#ef4444", "#f59e0b", "#84cc16", "#16a34a"][s]; };
async function send() {
  const name = $("name").value.trim(), email = $("email").value.trim(), password = $("pw").value;
  if (name.length < 2) return say("m", "Enter your name.");
  if (password.length < 8) return say("m", "Password must be at least 8 characters.");
  if (password !== $("pw2").value) return say("m", "Passwords do not match.");
  $("go").disabled = true; say("m", "Sending OTP…", true);
  try { await api("/signup", { name, email, password }); $("s1").hidden = true; $("s2").hidden = false; say("m", "OTP sent.", true); $("otp").focus(); }
  catch (e) { say("m", e.message); }
  $("go").disabled = false;
}
$("go").onclick = send; $("resend").onclick = send;
$("verify").onclick = async () => {
  const otp = $("otp").value.trim();
  if (!/^\d{6}$/.test(otp)) return say("m", "Enter the 6 digit OTP.");
  $("verify").disabled = true;
  try { await api("/signup/verify", { email: $("email").value.trim(), otp }); location.replace("index.html"); }
  catch (e) { say("m", e.message); $("verify").disabled = false; }
};
</script></body></html>
