<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ConnectChat – Login</title><link rel="stylesheet" href="app.css"></head><body class="authbody">
<div class="authwrap"><div class="authcard">
 <div class="alogo">✈️</div><h1>ConnectChat</h1><p class="tag">Chat • Connect • Share</p>
 <div class="tabs"><button data-t="login" class="on">Login</button><button data-t="signup">Sign up</button><button data-t="forgot">Forgot</button></div>
 <form id="login" class="frm" autocomplete="on">
  <input id="li-id" placeholder="Username or email" autocomplete="username" required>
  <input id="li-pw" type="password" placeholder="Password" autocomplete="current-password" required>
  <button class="btn">Login</button>
 </form>
 <form id="signup" class="frm" hidden autocomplete="on">
  <input id="su-name" placeholder="Full name" autocomplete="name" required>
  <input id="su-user" placeholder="Username (letters, numbers, _ .)" autocomplete="username" required>
  <input id="su-email" type="email" placeholder="Email" autocomplete="email" required>
  <input id="su-pw" type="password" placeholder="Password (min 8 characters)" autocomplete="new-password" required>
  <button class="btn">Create account</button>
 </form>
 <form id="forgot" class="frm" hidden>
  <input id="fp-email" type="email" placeholder="Your account email" required>
  <button class="btn" id="fp-send" type="button">Send OTP</button>
  <div id="fp2" hidden><input id="fp-otp" inputmode="numeric" maxlength="6" placeholder="6 digit OTP"><input id="fp-pw" type="password" placeholder="New password (min 8 characters)" autocomplete="new-password"><button class="btn">Reset password</button></div>
 </form>
 <div id="msg" class="msg"></div>
 <p class="note">Messages are stored in our database and protected in transit (HTTPS). They are not end-to-end encrypted.</p>
</div></div>
<script>
const $=id=>document.getElementById(id);
const say=(t,ok)=>{$("msg").textContent=t;$("msg").className="msg "+(ok?"ok":"err")};
async function api(p,b){const r=await fetch("/api/cc"+p,{method:b?"POST":"GET",headers:b?{"Content-Type":"application/json"}:{},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Error "+r.status);return d}
api("/me").then(()=>location.replace("index.html")).catch(()=>{});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));["login","signup","forgot"].forEach(f=>$(f).hidden=f!==b.dataset.t);say("")});
const go=(fn)=>async e=>{e.preventDefault();const btn=e.target.querySelector(".btn:last-of-type");btn.disabled=true;try{await fn()}catch(x){say(x.message)}btn.disabled=false};
$("login").onsubmit=go(async()=>{await api("/login",{identifier:$("li-id").value,password:$("li-pw").value});location.replace("index.html")});
$("signup").onsubmit=go(async()=>{await api("/signup",{name:$("su-name").value,username:$("su-user").value,email:$("su-email").value,password:$("su-pw").value});location.replace("index.html")});
$("fp-send").onclick=async()=>{const b=$("fp-send");b.disabled=true;try{await api("/forgot",{email:$("fp-email").value});$("fp2").hidden=false;say("If this email has an account, an OTP was sent.",true)}catch(x){say(x.message)}b.disabled=false};
$("forgot").onsubmit=go(async()=>{if($("fp2").hidden)return say("Tap Send OTP first.");await api("/reset",{email:$("fp-email").value,otp:$("fp-otp").value,password:$("fp-pw").value});say("Password changed. You can login now.",true);document.querySelector('.tabs [data-t=login]').click()});
</script></body></html>
