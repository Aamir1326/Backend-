<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Members – JMI Student Charity</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="members.css">
</head><body>
<nav class="side" id="side"></nav>
<div class="scrim" id="scrim"></div>
<header class="top"><button class="burger" id="burger" aria-label="Menu">☰</button><span class="brand">👥 Members</span><div class="avatar">👤</div></header>
<main class="mwrap">
 <div class="mhead"><h1>Our Members</h1><p>Tap a member to open the profile.</p></div>
 <div class="mgrid" id="grid"></div>
 <div class="card lockbox" id="lock" hidden><div style="font-size:50px">🔒</div><h2 style="justify-content:center">Locked</h2>
  <p id="why" class="msg err"></p><p style="color:var(--mut)">Open the menu → Members and enter the 6-digit password. Contact the admin if you need it.</p></div>
</main>
<script src="config.js"></script><script src="common.js"></script>
<script>
(async () => {
  async function loadPhoto(img, id, tk, errEl) {
    try {
      const p = await fetch(CONFIG.API + "/members/photo/" + encodeURIComponent(id) + "?t=" + encodeURIComponent(tk));
      if (!p.ok) { const j = await p.json().catch(() => ({})); throw new Error("[" + p.status + "] " + (j.error || "photo error")); }
      img.src = URL.createObjectURL(await p.blob());
    } catch (e) { errEl.textContent = "Photo problem: " + e.message; }
  }
  const g = id => document.getElementById(id), tk = sessionStorage.getItem("su_members");
  const lock = why => { g("why").textContent = why || ""; g("lock").hidden = false; };
  if (!tk) return lock("No password entered yet.");
  try {
    const r = await fetch(CONFIG.API + "/members?t=" + encodeURIComponent(tk));
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error("[" + r.status + "] " + (j.error || "server error")); }
    const d = await r.json();
    d.members.forEach(m => {
      const a = document.createElement("a"); a.className = "mcard"; a.href = "member.html?id=" + encodeURIComponent(m.id);
      const pe = document.createElement("small"); pe.className = "msg err";
      if (m.hasPhoto) { const i = document.createElement("img"); i.alt = m.name; a.append(i); loadPhoto(i, m.id, tk, pe); }
      const h = document.createElement("h3"); h.textContent = m.name; const s = document.createElement("small"); s.textContent = m.course || "";
      a.append(h, s, pe); g("grid").append(a);
    });
  } catch (e) { sessionStorage.removeItem("su_members"); lock(e.message || "Could not reach server"); }
})();
</script></body></html>
